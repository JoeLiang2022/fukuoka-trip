<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>載入中...</title>
<style>
:root { --bg:#0a0a0f; --bg2:#141420; --text:#e0e0e0; --text2:#aaa; --accent:#f093fb; --accent2:#4ecdc4; --border:rgba(255,255,255,0.08); --card:rgba(255,255,255,0.03); }
.light { --bg:#f5f5f5; --bg2:#fff; --text:#222; --text2:#666; --accent:#d63384; --accent2:#0d6efd; --border:rgba(0,0,0,0.1); --card:rgba(0,0,0,0.02); }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
/* Top bar */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(12px)}
.topbar a{color:var(--accent);text-decoration:none;font-size:14px;flex-shrink:0}
.topbar .title{flex:1;font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.topbar .actions{display:flex;gap:6px;flex-shrink:0}
.topbar button{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 8px;border-radius:6px;font-size:12px;cursor:pointer}
.topbar button:hover{border-color:var(--accent);color:var(--accent)}
/* Chapter nav — desktop: sidebar, mobile: bottom drawer */
.ch-nav{display:none}
@media(min-width:769px){
  .ch-nav{display:block;position:fixed;left:0;top:48px;bottom:60px;width:260px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding:8px 0;z-index:40}
  .ch-nav .ch-item{display:block;padding:8px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-left:3px solid transparent;text-decoration:none;transition:all .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-nav .ch-item:hover,.ch-nav .ch-item.active{background:var(--card);color:var(--accent);border-left-color:var(--accent)}
  .ch-nav .ch-item .ch-num{font-size:11px;color:var(--accent);font-weight:700;display:block;margin-bottom:1px}
  .ch-nav .ch-item .ch-title{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #content{margin-left:260px}
}
/* Mobile chapter selector */
.ch-mobile-btn{display:none}
@media(max-width:768px){
  .ch-mobile-btn{display:block;position:fixed;bottom:52px;right:12px;z-index:45;background:var(--accent);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
  .ch-drawer{display:none;position:fixed;bottom:0;left:0;right:0;max-height:60vh;background:var(--bg2);border-top:1px solid var(--border);z-index:55;overflow-y:auto;padding:12px 0;border-radius:16px 16px 0 0}
  .ch-drawer.open{display:block}
  .ch-drawer .ch-item{display:block;padding:10px 20px;font-size:14px;color:var(--text2);cursor:pointer;border-bottom:1px solid var(--border);text-decoration:none}
  .ch-drawer .ch-item:hover,.ch-drawer .ch-item.active{color:var(--accent);background:var(--card)}
  .ch-drawer .ch-item .ch-num{font-size:11px;color:var(--accent);font-weight:700;margin-right:6px}
}
/* Content */
.story{max-width:720px;margin:0 auto;padding:20px 16px 80px}
.story-title{font-size:24px;font-weight:700;color:var(--text);text-align:center;margin-bottom:24px;line-height:1.4}
@media(min-width:769px){.story-title{font-size:28px}}
.chapter{margin-bottom:36px;scroll-margin-top:60px}
.chapter-cover{border-radius:12px;overflow:hidden;margin-bottom:12px}
.chapter-cover img{width:100%;display:block}
.chapter-num{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:2px;margin-bottom:4px}
.chapter h2{font-size:18px;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.4}
@media(min-width:769px){.chapter h2{font-size:20px}}
.chapter-content{font-size:15px;line-height:1.9;color:var(--text2)}
@media(min-width:769px){.chapter-content{font-size:16px}}
.chapter-content h3{font-size:17px;font-weight:700;color:var(--text);margin:18px 0 8px}
.chapter-content h4{font-size:15px;font-weight:700;color:var(--text);margin:14px 0 6px}
.chapter-content strong{color:var(--text);font-weight:700}
.chapter-content em{font-style:italic}
.chapter-content ul{margin:8px 0;padding-left:20px;list-style:disc}
.chapter-content li{margin-bottom:4px;line-height:1.7}
.chapter-content code{background:rgba(240,147,251,0.1);padding:2px 6px;border-radius:4px;font-family:Consolas,Monaco,monospace;font-size:13px;color:var(--accent)}
.hook{margin-top:12px;padding:12px 16px;border-radius:10px;background:rgba(240,147,251,0.06);border-left:3px solid var(--accent);font-size:14px;color:var(--accent);font-weight:600;font-style:normal}
/* Audio bar */
.audio-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;z-index:50;backdrop-filter:blur(12px)}
@media(min-width:769px){.audio-bar{left:260px}}
.audio-bar button{padding:6px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.audio-bar .progress{flex:1;font-size:12px;color:var(--text2)}
.audio-bar .progress .current-chapter{color:var(--accent);font-weight:600}
.loading{text-align:center;padding:60px 20px;color:var(--text2);font-size:16px}
.error{text-align:center;padding:60px 20px;color:#f5576c;font-size:16px}
</style>
</head>
<body>
<!-- Top bar -->
<div class="topbar">
  <a href="https://joeliang2022.github.io/fukuoka-trip/stories/index.html">←</a>
  <div class="title" id="topTitle">載入中...</div>
  <div class="actions">
    <button onclick="toggleTheme()" id="btnTheme">☀️</button>
  </div>
</div>
<!-- Desktop sidebar chapter nav -->
<nav class="ch-nav" id="chNav"></nav>
<!-- Mobile chapter button + drawer -->
<button class="ch-mobile-btn" id="chMobileBtn" onclick="toggleDrawer()">📑</button>
<div class="ch-drawer" id="chDrawer"></div>
<!-- Content -->
<div id="content"><div class="loading">📖 載入中...</div></div>
<!-- Audio bar -->
<div class="audio-bar" id="audioBar">
  <button id="btnTTS" onclick="toggleTTS()">🔊 朗讀</button>
  <div class="progress"><span class="current-chapter" id="ttsStatus">點擊開始朗讀</span></div>
  <button onclick="stopTTS()" style="background:#333;padding:6px 10px;font-size:11px">⏹</button>
</div>
<audio id="ap" preload="auto"></audio>
<script>
var AUDIO_BASE='https://joeliang2022.github.io/fukuoka-trip/stories/audio/';
var RAW_BASE='https://api.github.com/repos/JoeLiang2022/fukuoka-trip/contents/stories/data/';
var IMG_BASE='https://joeliang2022.github.io/fukuoka-trip/stories/img/';
var au=document.getElementById('ap'),audioFiles=[],chapterTexts=[],ci=0,playing=false,useBrowserTTS=false;
var TTS_API='https://live-subtitle.onrender.com/api/story/tts',TTS_CODE='0910164482';

// Theme
function toggleTheme(){
  document.body.classList.toggle('light');
  var isLight=document.body.classList.contains('light');
  document.getElementById('btnTheme').textContent=isLight?'🌙':'☀️';
  localStorage.setItem('readerTheme',isLight?'light':'dark');
}
(function(){var t=localStorage.getItem('readerTheme');if(t==='light'){document.body.classList.add('light');document.getElementById('btnTheme').textContent='🌙';}})();

// Chapter drawer (mobile)
function toggleDrawer(){document.getElementById('chDrawer').classList.toggle('open');}

// Scroll to chapter
function goChapter(i){
  var el=document.getElementById('ch'+i);
  if(el){el.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('chDrawer').classList.remove('open');updateActiveChapter(i);}
}
function updateActiveChapter(idx){
  document.querySelectorAll('.ch-item').forEach(function(el,i){el.classList.toggle('active',i===idx);});
}

// Markdown to HTML
function md(text){
  if(!text)return '';
  var s=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/^### (.+)$/gm,'<h4>$1</h4>');
  s=s.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');
  s=s.replace(/^\*   (.+)$/gm,'<li>$1</li>');
  s=s.replace(/^- (.+)$/gm,'<li>$1</li>');
  s=s.replace(/^\d+\.\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\n/g,'<br>');
  s=s.replace(/<br><(h[34]|ul|li)/g,'<$1');
  s=s.replace(/<\/(h[34]|ul|li)><br>/g,'</$1>');
  return s;
}

// Load story
var params=new URLSearchParams(window.location.search);
var storyId=params.get('id');
if(!storyId){document.getElementById('content').innerHTML='<div class="error">缺少故事 ID</div>';}
else{
  fetch(RAW_BASE+storyId+'.json?ref=main',{headers:{'Accept':'application/vnd.github.v3.raw'}}).then(function(r){
    if(!r.ok)throw new Error('找不到故事 ('+r.status+')');return r.json();
  }).then(function(story){
    document.title=story.title||'故事';
    document.getElementById('topTitle').textContent=story.title||'故事';
    var chapters=story.chapters||[];
    // Build chapter nav
    var navHtml='',drawerHtml='';
    chapters.forEach(function(ch,i){
      var label='第'+ch.num+'篇';
      var short=(ch.title||'').substring(0,20);
      navHtml+='<a class="ch-item" onclick="goChapter('+i+')"><span class="ch-num">'+label+'</span><span class="ch-title">'+short+'</span></a>';
      drawerHtml+='<a class="ch-item" onclick="goChapter('+i+')"><span class="ch-num">'+label+'</span> '+short+'</a>';
    });
    document.getElementById('chNav').innerHTML=navHtml;
    document.getElementById('chDrawer').innerHTML=drawerHtml;
    // Build content
    var html='<article class="story"><h1 class="story-title">'+(story.title||'').replace(/</g,'&lt;')+'</h1>';
    chapters.forEach(function(ch,i){
      html+='<section class="chapter" id="ch'+i+'">';
      html+='<div class="chapter-cover" id="cover'+i+'"><img src="'+IMG_BASE+storyId+'_'+i+'.png" alt="" onerror="this.parentElement.style.display=\'none\'"></div>';
      html+='<div class="chapter-num">第 '+ch.num+' 篇</div>';
      html+='<h2>'+(ch.title||'').replace(/</g,'&lt;')+'</h2>';
      html+='<div class="chapter-content">'+md(ch.text)+'</div>';
      if(ch.hook)html+='<blockquote class="hook">💬 '+(ch.hook||'').replace(/</g,'&lt;')+'</blockquote>';
      html+='</section>';
      audioFiles.push(AUDIO_BASE+storyId+'_'+i+'.wav');
      chapterTexts.push((ch.title||'')+'。'+(ch.text||'').replace(/[#*`_\-]/g,''));
    });
    html+='</article>';
    document.getElementById('content').innerHTML=html;
    // Scroll spy for active chapter
    if('IntersectionObserver' in window){
      var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){var idx=parseInt(e.target.id.replace('ch',''));updateActiveChapter(idx);}});},{threshold:0.3});
      chapters.forEach(function(_,i){var el=document.getElementById('ch'+i);if(el)obs.observe(el);});
    }
  }).catch(function(e){document.getElementById('content').innerHTML='<div class="error">❌ '+e.message+'</div>';});
}
</script>
<script>
// Audio player — lazy TTS generation
function playChapter(i){
  if(i>=audioFiles.length){document.getElementById('ttsStatus').textContent='朗讀完畢';playing=false;ci=0;document.getElementById('btnTTS').textContent='🔊 朗讀';return;}
  ci=i;document.getElementById('ttsStatus').textContent='第'+(i+1)+'篇/'+audioFiles.length+' 載入中...';
  if(useBrowserTTS){playBrowserTTS(i);return;}
  var testAu=new Audio();testAu.src=audioFiles[i];
  testAu.oncanplaythrough=function(){au.src=audioFiles[i];au.onended=function(){playChapter(i+1);};document.getElementById('ttsStatus').textContent='第'+(i+1)+'篇/'+audioFiles.length;au.play().catch(function(){generateAndPlay(i);});};
  testAu.onerror=function(){generateAndPlay(i);};
}
function generateAndPlay(i){
  document.getElementById('ttsStatus').textContent='第'+(i+1)+'篇 🔊 生成中...';
  fetch(TTS_API,{method:'POST',headers:{'Content-Type':'application/json','X-Passcode':TTS_CODE},body:JSON.stringify({text:chapterTexts[i],voice:'Aoede'})}).then(function(r){if(!r.ok)throw new Error('fail');return r.json();}).then(function(d){if(d.audio){au.src='data:audio/wav;base64,'+d.audio;au.onended=function(){playChapter(i+1);};document.getElementById('ttsStatus').textContent='第'+(i+1)+'篇/'+audioFiles.length;au.play();}else throw new Error('no');}).catch(function(){useBrowserTTS=true;playBrowserTTS(i);});
}
function playBrowserTTS(i){
  if(i>=chapterTexts.length){playChapter(audioFiles.length);return;}
  window.speechSynthesis.cancel();document.getElementById('ttsStatus').textContent='第'+(i+1)+'篇/'+audioFiles.length+' (瀏覽器)';
  var u=new SpeechSynthesisUtterance(chapterTexts[i]);u.lang='zh-TW';u.rate=1.0;u.onend=function(){playChapter(i+1);};window.speechSynthesis.speak(u);
}
function toggleTTS(){
  if(playing){if(useBrowserTTS){window.speechSynthesis.pause();}else{au.pause();}playing=false;document.getElementById('btnTTS').textContent='▶ 繼續';}
  else{playing=true;document.getElementById('btnTTS').textContent='⏸ 暫停';if(useBrowserTTS){if(window.speechSynthesis.paused){window.speechSynthesis.resume();}else{playChapter(ci);}}else{if(au.src&&au.paused&&au.currentTime>0){au.play();}else{playChapter(ci);}}}
}
function stopTTS(){au.pause();au.removeAttribute('src');window.speechSynthesis.cancel();playing=false;ci=0;useBrowserTTS=false;document.getElementById('btnTTS').textContent='🔊 朗讀';document.getElementById('ttsStatus').textContent='已停止';}
</script>
</body>
</html>
