<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 AI Story Creator</title>
<link rel="stylesheet" href="style.css?v=20260328">
<style>
/* Inline critical auth gate styles */
body{background:#0a0a0f;color:#e8e8e8;font-family:'Segoe UI',sans-serif;margin:0}
.auth-gate{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e)}
.auth-box{text-align:center;padding:40px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);max-width:320px;width:90%}
.auth-icon{font-size:48px;margin-bottom:12px}
.auth-box h2{font-size:20px;color:#f093fb;margin-bottom:4px}
.auth-box p{font-size:13px;color:#888;margin-bottom:20px}
.auth-box input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:16px;text-align:center;letter-spacing:2px;margin-bottom:12px;box-sizing:border-box}
.auth-box input:focus{border-color:#f093fb;outline:none}
.auth-box button{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="authGate" class="auth-gate">
  <div class="auth-box">
    <div class="auth-icon">📖</div>
    <h2>AI Story Creator</h2>
    <p>請輸入存取碼</p>
    <input type="password" id="authCode" placeholder="Access Code" maxlength="20" onkeydown="if(event.key==='Enter')checkAuth()">
    <button onclick="checkAuth()">進入</button>
    <div id="authError" style="color:#f5576c;font-size:13px;margin-top:8px;display:none">存取碼錯誤</div>
  </div>
</div>
<div id="mainApp" style="display:none">
<div class="header">
  <h1>📖 AI Story Creator</h1>
  <p>從概念到故事，AI 幫你寫出抓眼球的篇章</p>
</div>
<div class="container">
  <div class="section-title">🎯 目標觀眾</div>
  <div class="chip-row" id="audienceRow"></div>
  <div class="section-title">📝 文字種類</div>
  <div class="chip-row" id="styleRow"></div>
  <div class="section-title">🔥 熱門主題</div>
  <div class="cat-row" id="catRow"></div>
  <div class="topic-grid" id="topicGrid"></div>
  <div class="custom-input">
    <textarea id="customTopic" placeholder="✏️ 或輸入自訂主題/故事引導（可輸入詳細的故事設定、角色描述、劇情方向等）..." maxlength="2000" rows="3" style="width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>
  </div>
  <div class="chapter-count">
    <span>📄 篇章數</span>
    <div class="count-btns">
      <button onclick="setChapters(3)" id="ch3" class="active">3篇</button>
      <button onclick="setChapters(5)" id="ch5">5篇</button>
      <button onclick="setChapters(7)" id="ch7">7篇</button>
    </div>
  </div>
  <div class="chapter-count">
    <span>🖼️ 配圖</span>
    <div class="count-btns">
      <button onclick="toggleImages(false)" id="imgOff" class="active">關閉</button>
      <button onclick="toggleImages(true)" id="imgOn">開啟</button>
    </div>
  </div>
  <div class="chapter-count">
    <span>📝 篇幅</span>
    <div class="count-btns">
      <button onclick="setLength('short')" id="lenShort">短 200字</button>
      <button onclick="setLength('medium')" id="lenMedium" class="active">中 400字</button>
      <button onclick="setLength('long')" id="lenLong">長 500-800字</button>
    </div>
  </div>
  <div class="chapter-count">
    <span>🔊 語音</span>
    <div class="count-btns">
      <button onclick="setVoice('off')" id="voiceOff" class="active">關閉</button>
      <button onclick="setVoice('browser')" id="voiceBrowser">🆓瀏覽器</button>
      <button onclick="setVoice('kore')" id="voiceKore">Kore♀</button>
      <button onclick="setVoice('zephyr')" id="voiceZephyr">Zephyr♀</button>
      <button onclick="setVoice('aoede')" id="voiceAoede" style="border-color:rgba(240,147,251,0.4)">Aoede♀</button>
      <button onclick="setVoice('leda')" id="voiceLeda">Leda♀</button>
      <button onclick="setVoice('puck')" id="voicePuck">Puck♂</button>
      <button onclick="setVoice('orus')" id="voiceOrus">Orus♂</button>
      <button onclick="setVoice('charon')" id="voiceCharon">Charon♂</button>
      <button onclick="setVoice('fenrir')" id="voiceFenrir">Fenrir♂</button>
    </div>
    <div style="margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="font-size:12px;color:#888">語速</label>
      <select id="voiceSpeed" onchange="window._voiceSpeed=this.value" style="padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#ccc;font-size:12px">
        <option value="slow">慢速</option>
        <option value="normal" selected>正常</option>
        <option value="fast">快速</option>
      </select>
      <label style="font-size:12px;color:#888">風格</label>
      <select id="voiceStyle" onchange="window._voiceStyle=this.value" style="padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#ccc;font-size:12px">
        <option value="natural" selected>自然</option>
        <option value="warm">溫暖</option>
        <option value="energetic">活力</option>
        <option value="calm">沉穩</option>
        <option value="podcast">Podcast</option>
        <option value="storytelling">說書</option>
      </select>
    </div>
  </div>
  <button class="gen-btn" id="btnGenerate" onclick="generate()">✨ 生成故事</button>
  <button class="gen-btn" style="background:linear-gradient(135deg,#333,#555);margin-top:8px" onclick="showPublished()">📂 已發佈故事</button>
  <div id="output"></div>
</div>
<div class="toast" id="toast"></div>
</div><!-- end mainApp -->
<script>
// Fallback if app.js fails to load
window.onerror = function(msg, url, line) {
  var g = document.getElementById('authGate');
  if (g) g.innerHTML = '<div class="auth-box"><div class="auth-icon">⚠️</div><h2>載入錯誤</h2><p>' + msg + '</p><p style="margin-top:12px"><a href="." style="color:#f093fb">重新整理</a></p></div>';
};
</script>
<script src="prompt-assembler.js?v=2"></script>
<script src="session-memory.js?v=2"></script>
<script src="outline-generator.js?v=2"></script>
<script src="main.js?v=2"></script>
</body>
</html>
